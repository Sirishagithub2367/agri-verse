<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriConnect</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="lang-switcher" style="text-align:center; margin:10px;">
  <button onclick="loadLanguage('en')">EN</button>
  <button onclick="loadLanguage('hi')">हिं</button>
  <button onclick="loadLanguage('ta')">தமிழ்</button>
</div>

<nav class="navbar navbar-expand-lg navbar-dark bg-success">
  <div class="container">
    <a class="navbar-brand" href="index.html">🌾 AgriConnect</a>
    <div>
      <a class="btn btn-outline-light me-2" href="farmer.html" data-lang-key="farmer">Farmer</a>
      <a class="btn btn-outline-light me-2" href="buyer.html" data-lang-key="buyer">Buyer</a>
      <a class="btn btn-outline-light me-2" href="transaction.html" data-lang-key="viewTransactions">Transactions</a>
      <a class="btn btn-light" href="chatbot.html" data-lang-key="aiAssistantBtn">🤖 AI Assistant</a>
    </div>
  </div>
</nav>

<div class="container text-center mt-5">
  <h1 data-lang-key="heroTitle">Strengthening Market Linkages for Farmers</h1>
  <p class="lead" data-lang-key="heroSubtitle">Transparent prices. Verified buyers. Fair deals.</p>
  <a href="farmer.html" class="btn btn-success btn-lg m-2" data-lang-key="imFarmer">I'm a Farmer</a>
  <a href="buyer.html" class="btn btn-primary btn-lg m-2" data-lang-key="imBuyer">I'm a Buyer</a>

  <div class="mt-4">
    <input type="text" id="testVoiceInput" placeholder="Try speaking..." data-lang-key-placeholder="trySpeaking" style="padding:8px; width:250px;">
    <button onclick="startVoiceInput('testVoiceInput')" data-lang-key="speakBtn">🎤 Speak</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/language-switcher.js"></script>
<script src="js/voice-to-text.js"></script>
</body>
</html>
